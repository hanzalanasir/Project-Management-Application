<mat-card>
  <mat-card-header>
    <mat-card-title>Create task</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" required />
        @if (form.get('title')?.touched && form.get('title')?.hasError('required')) {
          <mat-error>Title is required.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Priority</mat-label>
        <mat-select formControlName="priority">
          @for (priority of priorities; track priority) {
            <mat-option [value]="priority">{{ priority }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Due date (optional)</mat-label>
        <input matInput type="date" formControlName="dueDate" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Assignee ID (optional)</mat-label>
        <input matInput formControlName="assigneeId" />
      </mat-form-field>

      <app-error-display [errors]="serverErrors()"></app-error-display>

      <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
        Create task
      </button>
    </form>
  </mat-card-content>
</mat-card>
