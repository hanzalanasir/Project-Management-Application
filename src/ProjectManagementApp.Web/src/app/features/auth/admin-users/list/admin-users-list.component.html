<h2>Users</h2>
<p class="page-hint">Adding someone to a project's team needs their User ID below — use the copy button.</p>

<div class="table-container">
<table mat-table [dataSource]="users()" class="users-table">
  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let user">
      <a [routerLink]="['/auth/admin-users', user.id]">{{ user.fullName }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="userId">
    <th mat-header-cell *matHeaderCellDef>User ID</th>
    <td mat-cell *matCellDef="let user">
      <span class="user-id">{{ user.id }}</span>
      <button
        mat-icon-button
        type="button"
        class="copy-button"
        [attr.aria-label]="'Copy user ID for ' + user.fullName"
        (click)="copyId(user.id)">
        <mat-icon>{{ copiedId() === user.id ? 'check' : 'content_copy' }}</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let user">{{ user.email }}</td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Role</th>
    <td mat-cell *matCellDef="let user"><span class="chip" [attr.data-role]="user.role">{{ user.role }}</span></td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let user">
      <span class="chip" [attr.data-active]="user.isActive">{{ user.isActive ? 'Active' : 'Inactive' }}</span>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
</div>
